<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <header class="app__header">
            <div class="app__header-left">
                <h1 class="app__title">Task<span>Flow</span></h1>
                <p class="app__subtitle">Stay organized, stay ahead.</p>
            </div>
            <div class="app__header-right">
                <div class="app__stats">
                    <span class="js-task-count">0</span>
                    <span class="app__stats-label">tasks remaining</span>
                </div>
                <button class="js-theme-toggle theme-toggle" aria-label="Toggle dark mode">
                    <span class="theme-toggle__icon theme-toggle__icon--light">☀️</span>
                    <span class="theme-toggle__icon theme-toggle__icon--dark">🌙</span>
                </button>
            </div>
        </header>
        <main class="app__main">

            <div class="input-area">
                <div class="input-area__field">
                    <input type="text" class="js-task-input task-input" placeholder="Add a new task..." maxlength="100"
                        autocomplete="off">
                </div>
                <div class="input-area__controls">
                    <select class="js-priority-select priority-select">
                        <option value="medium" selected>⚡ Medium</option>
                        <option value="high">🔴 High</option>
                        <option value="low">🟢 Low</option>
                    </select>
                    <button class="js-add-btn add-btn">
                        Add Task
                    </button>
                </div>
            </div>
            <div class="dashboard">
                <div class="dashboard__card">
                    <span class="dashboard__number js-stat-total">0</span>
                    <span class="dashboard__label">Total</span>
                </div>
                <div class="dashboard__card dashboard__card--completed">
                    <span class="dashboard__number js-stat-completed">0</span>
                    <span class="dashboard__label">Completed</span>
                </div>
                <div class="dashboard__card dashboard__card--pending">
                    <span class="dashboard__number js-stat-pending">0</span>
                    <span class="dashboard__label">Pending</span>
                </div>
            </div>

            <div class="progress-section">
                <div class="progress-section__header">
                    <span class="progress-section__label">Overall Progress</span>
                    <span class="js-progress-percent progress-section__percent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="js-progress-fill progress-bar__fill"></div>
                </div>
            </div>
            <div class="filters">
                <button class="js-filter-btn filter-btn is-active" data-filter="all">
                    All
                </button>
                <button class="js-filter-btn filter-btn" data-filter="active">
                    Active
                </button>
                <button class="js-filter-btn filter-btn" data-filter="completed">
                    Completed
                </button>
            </div>

            <div class="task-list-wrapper">
                <ul class="js-task-list task-list">
                </ul>
                <div class="js-empty-state empty-state">
                    <p class="empty-state__icon">📋</p>
                    <p class="empty-state__text">No tasks yet!</p>
                    <p class="empty-state__subtext">Add a task above to get started.</p>
                </div>
            </div>

        </main>

    </div>


    <script src="js/main.js"></script>
</body>

</html>
